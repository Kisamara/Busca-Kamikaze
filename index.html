<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="refresh" content="4;url=https://commodity-honor-children-gathered.trycloudflare.com"/>
<meta name="robots" content="noindex"/>
<title>Busca Kamikaze — Vividense</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
         font-family:"Segoe UI", system-ui, -apple-system, sans-serif; background:#f8f9fa; color:#202124; }
  .box { background:#fff; border:1px solid #dadce0; border-radius:14px; padding:28px 22px; width:min(440px,100%);
         text-align:center; box-shadow:0 1px 6px rgba(32,33,36,.15); }
  .badge { display:inline-block; background:#e8f0fe; color:#1a73e8; font-size:.75rem; font-weight:700;
           padding:3px 10px; border-radius:999px; margin-bottom:12px; }
  h1 { font-size:1.25rem; margin:0 0 10px; }
  .spin { width:34px; height:34px; border:4px solid #e8f0fe; border-top-color:#1a73e8; border-radius:50%;
          margin:14px auto; animation:r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  a.btn { display:inline-block; margin-top:10px; background:#1a73e8; color:#fff; text-decoration:none;
          padding:12px 18px; border-radius:10px; font-weight:600; word-break:break-all; }
  p { color:#5f6368; font-size:.88rem; margin:8px 0; }
</style>
</head>
<body>
  <div class="box">
    <div class="badge">Vividense</div>
    <h1>Abrindo o servidor Busca Kamikaze…</h1>
    <div class="spin"></div>
    <p>Se não abrir sozinho em alguns segundos, toque no botão:</p>
    <a class="btn" id="go" href="https://commodity-honor-children-gathered.trycloudflare.com">Abrir Busca Kamikaze</a>
    <p>Atualizado em 25/09/2026 13:51 (horário de Brasília).</p>
    <p>Se não abrir, o servidor pode estar desligado no PC — avise o Valdir.</p>
  </div>
<script>
(function () {
  var fallback = "https://commodity-honor-children-gathered.trycloudflare.com";
  var done = false;
  function go(u) { if (done) return; done = true; document.getElementById("go").href = u; location.replace(u); }
  var t = setTimeout(function () { go(fallback); }, 2500);
  try {
    fetch("link.json?ts=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        clearTimeout(t);
        if (j && typeof j.url === "string" && /^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/i.test(j.url)) go(j.url);
        else go(fallback);
      })
      .catch(function () { clearTimeout(t); go(fallback); });
  } catch (e) { clearTimeout(t); go(fallback); }
})();
</script>
</body>
</html>
